<!doctype html><meta charset="utf-8"><title>Aperçu assets scrapbook</title>
<style>
body{margin:0;padding:24px;background:#c4a57a url(../public/assets/scrapbook/kraft.webp);font:16px Georgia,serif;color:#2a1f16}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.sheet{width:260px;height:150px;background:#f8f1e2 url(../public/assets/scrapbook/paper-grain.webp);background-blend-mode:multiply;box-shadow:0 1px 1px rgb(60 40 20/.22),0 6px 14px -6px rgb(60 40 20/.35);position:relative;padding:16px}
.tape{position:absolute;width:80px;height:22px;top:-10px;left:90px;background:url(../public/assets/scrapbook/tape-1.svg) 0 0/100% 100%}
.torn{-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 12px) no-repeat,url(../public/assets/scrapbook/torn-edge.svg) bottom/240px 14px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 12px) no-repeat,url(../public/assets/scrapbook/torn-edge.svg) bottom/240px 14px repeat-x}
.stamp{width:72px;height:72px;background:url(../public/assets/scrapbook/stamp-ring.svg) 0 0/100%;display:grid;place-items:center;color:#b3362b;font-weight:800;font-size:24px;transform:rotate(-8deg)}
.srect{width:150px;height:48px;background:url(../public/assets/scrapbook/stamp-rect.svg) 0 0/100% 100%;display:grid;place-items:center;color:#b3362b;font-weight:800;letter-spacing:.08em;transform:rotate(-7deg)}
.scrib{width:190px;height:110px;background:url(../public/assets/scrapbook/scribble-circle.svg) 0 0/100% 100%}
.ic{width:28px;height:28px;background:#2a1f16;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.print{background:#fffcf5;padding:6px;position:relative;box-shadow:0 2px 5px -1px rgb(60 40 20/.4)}
.print::before,.print::after{content:'';position:absolute;width:12px;height:12px;top:2px;background:url(../public/assets/scrapbook/photo-corner.svg) 0 0/100%}
.print::before{left:2px}.print::after{right:2px;transform:scaleX(-1)}
</style>
<div class="row"><div class="sheet"><span class="tape"></span>Feuille + grain + tape</div><div class="sheet torn" style="height:120px">Fiche déchirée</div><div class="print"><img src="../public/avatars/cat.svg" width="64"></div><img src="../public/logo.svg" width="64"><img src="../public/logo.svg" width="32"><img src="../public/logo.svg" width="16"></div>
<div class="row"><div class="stamp">42</div><div class="srect">IMPOSTEUR</div><div class="scrib"></div>
<div class="ic" style="--u:url(../public/assets/scrapbook/icons/pencil.svg)"></div><div class="ic" style="--u:url(../public/assets/scrapbook/icons/check.svg)"></div><div class="ic" style="--u:url(../public/assets/scrapbook/icons/ballot.svg)"></div><div class="ic" style="--u:url(../public/assets/scrapbook/icons/crown.svg)"></div><div class="ic" style="--u:url(../public/assets/scrapbook/icons/clock.svg)"></div><div class="ic" style="--u:url(../public/assets/scrapbook/icons/copy.svg)"></div></div>
<div class="row"><div style="width:512px;height:256px;background:url(../public/assets/scrapbook/kraft.webp);outline:1px dashed #0003">kraft 2 tuiles (raccord ?)</div></div>
